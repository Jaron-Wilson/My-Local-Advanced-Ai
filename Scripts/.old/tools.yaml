# Model Management Tools
list_available_models:
  type: function
  function:
    name: list_available_models
    description: List available LM Studio models and their specializations
    parameters:
      type: object
      properties: {}

select_model:
  type: function
  function:
    name: select_model
    description: Select a specialized model for a specific task
    parameters:
      type: object
      properties:
        task_type:
          type: string
          description: The type of task to perform
          enum:
            - summarization
            - analysis
            - creative
            - coding
            - default
      required:
        - task_type

load_model:
  type: function
  function:
    name: load_model
    description: Load a specific model into LM Studio
    parameters:
      type: object
      properties:
        model_id:
          type: string
          description: The model identifier to load
      required:
        - model_id

unload_model:
  type: function
  function:
    name: unload_model
    description: Unload a specific model from LM Studio
    parameters:
      type: object
      properties:
        model_id:
          type: string
          description: The model identifier to unload
      required:
        - model_id

# Time and Date Tools
get_current_time:
  type: function
  function:
    name: get_current_time
    description: Get the current time, only if asked
    parameters:
      type: object
      properties: {}

get_current_date:
  type: function
  function:
    name: get_current_date
    description: Get the current date, only if asked
    parameters:
      type: object
      properties: {}

# Web Information Tools
google_search:
  type: function
  function:
    name: google_search
    description: Perform a Google search and return the top result.
    parameters:
      type: object
      properties:
        query:
          type: string
          description: The search query to look up.
      required:
        - query

google_image_search:
  type: function
  function:
    name: google_image_search
    description: Search for an image on Google and download it.
    parameters:
      type: object
      properties:
        query:
          type: string
          description: The image search term.
      required:
        - query

read_webpage:
  type: function
  function:
    name: read_webpage
    description: Read and summarize the content of a webpage
    parameters:
      type: object
      properties:
        url:
          type: string
          description: The URL of the webpage to read
      required:
        - url

background_check:
  type: function
  function:
    name: background_check
    description: Perform a background check on a person and return detailed information.
    parameters:
      type: object
      properties:
        name:
          type: string
          description: The name of the person to search for.
      required:
        - name

# Voice and Media Tools
listen_voice:
  type: function
  function:
    name: listen_voice
    description: Listen for voice input from microphone
    parameters:
      type: object
      properties: {}

analyze_pdf:
  type: function
  function:
    name: analyze_pdf
    description: Extract and analyze text from a PDF file
    parameters:
      type: object
      properties:
        filepath:
          type: string
          description: Path to the PDF file
      required:
        - filepath

summarize_youtube:
  type: function
  function:
    name: summarize_youtube
    description: Get transcript and summarize YouTube video
    parameters:
      type: object
      properties:
        video_id:
          type: string
          description: YouTube video ID
      required:
        - video_id

# Weather Tools
get_weather:
  type: function
  function:
    name: get_weather
    description: Get current weather for a location
    parameters:
      type: object
      properties:
        location:
          type: string
          description: City name or coordinates
      required:
        - location

get_weather_forcast:
  type: function
  function:
    name: get_weather_forcast
    description: Get weather forecast for a location
    parameters:
      type: object
      properties:
        location:
          type: string
          description: City name or coordinates
      required:
        - location

# Image Tools
generate_image:
  type: function
  function:
    name: generate_image
    description: Generate an image from text description using Stable Diffusion
    parameters:
      type: object
      properties:
        prompt:
          type: string
          description: The text description of the image to generate
        negative_prompt:
          type: string
          description: Things to avoid in the image
          default: ""
        steps:
          type: integer
          description: Number of sampling steps
          default: 20
        width:
          type: integer
          description: Image width
          default: 512
        height:
          type: integer
          description: Image height
          default: 512
      required:
        - prompt

open_saved_image:
  type: function
  function:
    name: open_saved_image
    description: List and open saved images from ./images and ./generated_images directories
    parameters:
      type: object
      properties:
        action:
          type: string
          description: Either 'list' to show available images or 'open' to open a specific image
        image_number:
          type: integer
          description: The number of the image to open from the list
          default: 0
      required:
        - action

speak_text:
  type: function
  function:
    name: speak_text
    description: Convert text to speech and play it
    parameters:
      type: object
      properties:
        text:
          type: string
          description: The text to convert to speech
      required:
        - text

# File Management Tools
list_files:
  type: function
  function:
    name: list_files
    description: List files in a directory
    parameters:
      type: object
      properties:
        path:
          type: string
          description: Directory path to list files from
        pattern:
          type: string
          description: Optional file pattern to filter by (e.g. *.txt)
          default: "*"
      required:
        - path

move_file:
  type: function
  function:
    name: move_file
    description: Move a file from one location to another
    parameters:
      type: object
      properties:
        source:
          type: string
          description: Source file path
        destination:
          type: string
          description: Destination file path or directory
      required:
        - source
        - destination

copy_file:
  type: function
  function:
    name: copy_file
    description: Copy a file from one location to another
    parameters:
      type: object
      properties:
        source:
          type: string
          description: Source file path
        destination:
          type: string
          description: Destination file path or directory
      required:
        - source
        - destination

delete_file:
  type: function
  function:
    name: delete_file
    description: Delete a file from the file system
    parameters:
      type: object
      properties:
        path:
          type: string
          description: Path to the file to delete
      required:
        - path

create_file:
  type: function
  function:
    name: create_file
    description: Create a file with the given name and content
    parameters:
      type: object
      properties:
        name:
          type: string
          description: The name of the file to create
        content:
          type: string
          description: The content to write to the file
      required:
        - name
        - content

download_file:
  type: function
  function:
    name: download_file
    description: Download a file directly from a URL to the local computer. This tool handles the download operation for you, no coding required.
    parameters:
      type: object
      properties:
        url:
          type: string
          description: The URL of the file to download (e.g., https://example.com/file.pdf)
        save_path:
          type: string
          description: Local path where the file should be saved (e.g., C:/Downloads/file.pdf)
      required:
        - url
        - save_path

search_files:
  type: function
  function:
    name: search_files
    description: Search for files across drives or in a specific directory
    parameters:
      type: object
      properties:
        pattern:
          type: string
          description: Filename pattern to search for (e.g., *.jpg, document.pdf)
        location:
          type: string
          description: 'Optional: Directory to search in. Leave empty to search all available drives'
          default: ''
      required:
        - pattern

open_file:
  type: function
  function:
    name: open_file
    description: Open any file with the system's default application
    parameters:
      type: object
      properties:
        filepath:
          type: string
          description: Full path to the file to open
      required:
        - filepath

# Extract and analyze content from various file types
analyze_file:
  type: function
  function:
    name: analyze_file
    description: Extract and analyze content from various file types (text, CSV, JSON, code files, etc.)
    parameters:
      type: object
      properties:
        filepath:
          type: string
          description: Path to the file to analyze
        analysis_type:
          type: string
          description: Type of analysis to perform
          enum:
            - content
            - statistics
            - structure
            - summary
            - auto
          default: auto
      required:
        - filepath
